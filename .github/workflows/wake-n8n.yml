name: Wake n8n

on:
  workflow_dispatch:   # triggered by the pinger via API

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send GET to n8n with 90s timeout
        run: |
          echo "Sending GET to n8n with 90s timeout..."
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 90 \
            -H "Accept: text/html" \
            https://n8n-with-python-f7bi.onrender.com || true
          echo "Done"
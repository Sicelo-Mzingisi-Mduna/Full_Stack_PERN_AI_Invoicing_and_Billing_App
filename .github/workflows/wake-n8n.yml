name: Wake n8n

on:
  workflow_dispatch:
    inputs:
      n8n_url:
        description: 'The n8n instance URL to wake'
        required: true
        type: string
        default: 'https://n8n-with-python-f7bi.onrender.com'

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 2 # Lowered from 5 to 2
    steps:
      - name: Send GET to n8n
        run: |
          echo "Waking n8n at: ${{ inputs.n8n_url }}"
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 45 \
            -H "Accept: text/html" \
            ${{ inputs.n8n_url }} || true
          echo "Done"